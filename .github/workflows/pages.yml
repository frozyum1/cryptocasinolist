name: Build and deploy
on:
  push:
    branches: [main]
  schedule:
    # Daily rebuild: rolls month-dated titles over on the 1st, re-reads the live
    # StakeBet offer, and refreshes data-driven tables. Only changed URLs are pinged.
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # full history: lastmod comes from each file's last commit
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 build.py
      - name: Quality gate
        run: python3 seo/check.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/upload-artifact@v4
        with: { name: build-manifest, path: build-manifest.json }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: build-manifest }
      - run: python3 seo/indexnow.py
