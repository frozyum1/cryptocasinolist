name: Weekly draft
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      slug:
        description: "Keyword slug to draft (blank = next planned keyword)"
        required: false
permissions:
  contents: write
  pull-requests: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install anthropic
      - id: draft
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 seo/draft.py ${{ inputs.slug && format('--slug {0}', inputs.slug) || '' }}
      - name: Build and gate the draft
        if: steps.draft.outputs.file != ''
        id: gate
        run: |
          python3 build.py
          set +e
          python3 seo/check.py > gate.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat gate.txt
      - name: Open pull request
        if: steps.draft.outputs.file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          QUERY: ${{ steps.draft.outputs.query }}
          SLUG: ${{ steps.draft.outputs.slug }}
          FILE: ${{ steps.draft.outputs.file }}
          GATE: ${{ steps.gate.outputs.status }}
        run: |
          branch="draft/$(echo "$SLUG" | tr '/' '-')"
          git config user.name "seo-drafter"
          git config user.email "seo-drafter@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$FILE" data/keywords.json
          git commit -m "draft: $QUERY"
          git push -u origin "$branch"
          verdict=$([ "$GATE" = "0" ] && echo "passes the quality gate" || echo "FAILS the quality gate - fix before merging")
          {
            echo "AI-drafted page for **$QUERY** at \`/$SLUG/\`. The draft $verdict."
            echo
            echo "Before merging, check:"
            echo "- [ ] Every claim about a casino comes from a shortcode, not typed text"
            echo "- [ ] Nothing claims a test, deposit or statistic that did not happen"
            echo "- [ ] The page answers the query in its first two sentences"
            echo "- [ ] Title and description read naturally"
            echo
            echo "Merging publishes it on the next deploy."
            echo
            echo '<details><summary>Quality gate output</summary>'
            echo
            echo '```'
            cat gate.txt
            echo '```'
            echo '</details>'
          } > body.md
          gh pr create --title "Draft: $QUERY" --body-file body.md --base main --head "$branch"
